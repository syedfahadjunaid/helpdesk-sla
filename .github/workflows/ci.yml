name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Checkstyle, javac -Werror, unit + Testcontainers tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/helpdesk-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Testcontainers starts Postgres, RabbitMQ (with STOMP) and Mailpit on the runner's Docker.
      - run: sh mvnw -B verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: services/helpdesk-api/target/surefire-reports

  web:
    name: Web (lint, tests, type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: Docker images and compose file
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - name: Compose file is valid (with throwaway secrets)
        run: |
          for name in $(grep -oE '^[A-Z0-9_]+=' .env.example | tr -d '='); do echo "$name=ci-$(openssl rand -hex 12)"; done > .env
          docker compose config --quiet
      - run: docker compose build
      - name: Scan the images for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: helpdesk-sla-api:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
