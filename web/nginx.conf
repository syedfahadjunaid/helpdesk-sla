# Serves the built single-page app and forwards everything dynamic to the two API instances,
# so the browser only ever talks to one origin. The API is its own backend-for-frontend:
# the browser holds an HttpOnly session cookie, never a token.
upstream helpdesk_api {
    # Round robin. No sticky sessions needed: HTTP sessions live in Postgres (Spring Session),
    # and WebSocket messages reach every instance through RabbitMQ's STOMP relay.
    server api-1:8080;
    server api-2:8080;
}

# For the WebSocket upgrade: "Connection: upgrade" only when the client asked for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers. "always" also adds them to error responses.
    # CSP: scripts and styles only from this origin (no inline code); API calls and the
    # WebSocket only to this origin (Keycloak is only ever navigated to); no framing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Used by every proxied location below (they inherit these because they set none).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The API: calls, the start of sign-in, Keycloak's redirect back, and sign-out.
    location /api/ {
        proxy_pass http://helpdesk_api;
        client_max_body_size 1m;
    }
    location /oauth2/ {
        proxy_pass http://helpdesk_api;
    }
    location /login/oauth2/ {
        proxy_pass http://helpdesk_api;
    }
    location = /logout {
        proxy_pass http://helpdesk_api;
    }

    # Live updates: a long-lived WebSocket (STOMP) connection.
    location = /ws {
        proxy_pass http://helpdesk_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;   # STOMP heartbeats keep it alive; this only ends dead connections
    }

    # Built files have content hashes in their names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Anything else is a client-side route: serve index.html, never cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
