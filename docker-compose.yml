# The whole helpdesk on one machine:
#
#   .\scripts\init-env.ps1          (once: writes .env with random local secrets)
#   docker compose up -d --build    then open http://localhost:5580
#
# Two instances of the API run behind nginx, on purpose: the SLA worker, the outbox relay,
# the mailbox poller and the WebSocket fan-out are all built to be safe with several
# instances, and this is how you see it.
#
# All ports are bound to 127.0.0.1, and deliberately non-standard (other local projects hold
# the usual ones). Secrets come from .env; nothing has a default password.

name: helpdesk-sla

x-api: &api
  build: ./services/helpdesk-api
  image: helpdesk-sla-api:local   # one image, two containers
  environment: &api-env
    DB_URL: jdbc:postgresql://postgres:5432/helpdesk?currentSchema=helpdesk
    DB_APP_USERNAME: helpdesk_app
    DB_APP_PASSWORD: ${DB_APP_PASSWORD:?run scripts/init-env.ps1 to create .env}
    DB_OWNER_USERNAME: helpdesk_owner
    DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?run scripts/init-env.ps1 to create .env}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    RABBITMQ_STOMP_PORT: "61613"
    RABBITMQ_USERNAME: helpdesk
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?run scripts/init-env.ps1 to create .env}
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    MAILPIT_API_URL: http://mailpit:8025
    PUBLIC_URL: http://localhost:5580
    # The browser reaches Keycloak at localhost:8680; the API reaches it as keycloak:8080.
    KEYCLOAK_ISSUER_URI: http://localhost:8680/realms/helpdesk
    KEYCLOAK_BACKCHANNEL_URI: http://keycloak:8080/realms/helpdesk
    KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?run scripts/init-env.ps1 to create .env}
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    mailpit:
      condition: service_healthy
    keycloak:
      condition: service_healthy
  healthcheck:
    # The JRE image has no curl, so talk HTTP to the management port with bash's /dev/tcp
    # (explicitly bash: the image's /bin/sh is dash, which doesn't have it).
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
    interval: 5s
    timeout: 5s
    retries: 30
    # Generous on purpose: failures in this window don't count, and the first success marks
    # the container healthy at once, so a fast machine doesn't wait for it.
    start_period: 300s
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run scripts/init-env.ps1 to create .env}
      # Used once by infra/postgres/init/01-init.sh to create the logins
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?run scripts/init-env.ps1 to create .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?run scripts/init-env.ps1 to create .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run scripts/init-env.ps1 to create .env}
    ports:
      - "127.0.0.1:45432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP, so this only passes once the init script has finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    hostname: rabbitmq   # RabbitMQ stores its data under the node name, which includes the host name
    environment:
      RABBITMQ_DEFAULT_USER: helpdesk
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run scripts/init-env.ps1 to create .env}
    ports:
      - "127.0.0.1:45672:5672"     # AMQP
      - "127.0.0.1:45673:15672"    # management UI: http://localhost:45673
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-helpdesk.conf:ro
    healthcheck:
      # Wait until the broker has created its Erlang cookie. Healthchecks run as root, and a CLI
      # call before that point would create the cookie as root; the broker (user rabbitmq) then
      # can't read it and crashes on a fresh volume, which makes "docker compose up --wait" fail.
      test: ["CMD-SHELL", "test -f /var/lib/rabbitmq/.erlang.cookie && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # This project's own mail server stand-in: customers' emails arrive here, and so do all the
  # emails the helpdesk sends. Web UI: http://localhost:48025
  mailpit:
    image: axllent/mailpit:v1.33
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:41025:1025"     # SMTP
      - "127.0.0.1:48025:8025"     # web UI and REST API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/init-env.ps1 to create .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run scripts/init-env.ps1 to create .env}
      # Tokens always say iss=http://localhost:8680/realms/helpdesk, even when the API
      # fetches signing keys over the internal Docker network (http://keycloak:8080).
      KC_HOSTNAME: http://localhost:8680
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Fill in the ${...} placeholders of helpdesk-realm.json, at the first import only.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?run scripts/init-env.ps1 to create .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?run scripts/init-env.ps1 to create .env}
    ports:
      - "127.0.0.1:8680:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The Keycloak image has no curl, so talk HTTP to the management port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      # The first start rebuilds Keycloak for Postgres ("augmentation") and imports the realm:
      # well under a minute normally, but over 4 minutes was seen on a busy 4-CPU machine.
      start_period: 600s
    restart: unless-stopped

  # Two identical API instances. Published directly too (8580/8581) for scripts and debugging.
  api-1:
    <<: *api
    environment:
      <<: *api-env
      HELPDESK_INSTANCE: api-1
    ports:
      - "127.0.0.1:8580:8080"

  api-2:
    <<: *api
    environment:
      <<: *api-env
      HELPDESK_INSTANCE: api-2
    ports:
      - "127.0.0.1:8581:8080"

  # nginx: serves the React app and spreads API calls and WebSockets over both instances.
  # The only origin the browser uses (Keycloak's redirect URI points here).
  web:
    build: ./web
    image: helpdesk-sla-web:local
    ports:
      - "127.0.0.1:5580:8080"
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
