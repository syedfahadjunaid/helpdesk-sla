# The STOMP plugin is what Spring's broker relay talks to: WebSocket messages from any app
# instance reach browsers connected to every instance.
stomp.listeners.tcp.1 = 0.0.0.0:61613
# Every STOMP connection logs in as the "helpdesk" user. (The STOMP plugin's default user for
# anonymous logins is "guest", which doesn't exist here: RABBITMQ_DEFAULT_USER replaces it.)
